<mat-toolbar class="navbar" [class.scrolled]="scrolled()">
  <!-- Brand -->
  <button class="brand" (click)="scrollTo('hero')">
    <span class="brand-prefix">~/</span>luc.allaire
  </button>

  <!-- Desktop anchor nav -->
  <nav class="nav-links" [attr.aria-label]="lang.t('Main navigation', 'Navigation principale')">
    @for (item of navItems; track item.fragment) {
      <button
        class="nav-link"
        [class.active]="isActive(item.fragment)"
        (click)="scrollTo(item.fragment)"
      >
        <span class="nav-index">{{ item.index }}</span>
        <span class="nav-sep">.</span>
        <span class="nav-label">{{ lang.t(item.labelEn, item.labelFr) }}</span>
        <span class="nav-cursor" aria-hidden="true">_</span>
      </button>
    }
  </nav>

  <span class="spacer"></span>

  <ui-status-pill
    class="navbar-status"
    [label]="lang.t('Open to work · 3 weeks notice', 'Disponible · 3 semaines')"
    status="available"
  />

  <!-- Lang toggle -->
  <button
    class="lang-btn"
    [attr.aria-label]="lang.t('Switch to French', 'Switch to English')"
    [matTooltip]="lang.t('Switch to French', 'Switch to English')"
    (click)="lang.toggle()"
  >
    <span class="lang-label">{{ lang.t('FR', 'EN') }}</span>
  </button>

  <!-- Theme toggle -->
  <button
    mat-icon-button
    class="theme-btn"
    [attr.aria-label]="
      theme.isDark()
        ? lang.t('Switch to light mode', 'Passer en mode clair')
        : lang.t('Switch to dark mode', 'Passer en mode sombre')
    "
    [matTooltip]="
      theme.isDark() ? lang.t('Light mode', 'Mode clair') : lang.t('Dark mode', 'Mode sombre')
    "
    (click)="theme.toggle()"
  >
    <mat-icon>{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <!-- Mobile hamburger — shows overlay instead of mat-menu -->
  <button
    class="hamburger"
    mat-icon-button
    [attr.aria-label]="lang.t('Open menu', 'Ouvrir le menu')"
    (click)="openMobileNav()"
  >
    <mat-icon>menu</mat-icon>
  </button>
</mat-toolbar>

<!-- Full-screen mobile nav overlay -->
@if (mobileNavOpen()) {
  <app-mobile-nav (closed)="closeMobileNav()" />
}
